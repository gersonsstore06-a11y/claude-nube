<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa 3D Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9eef2; --panel: #ffffff; --ink: #0f1b24; --muted: #5a6975; --line: #e1e7ec; --soft: #f3f6f8;
    --accent: #0b7a88; --accent-ink: #075e69; --accent-soft: #e2f3f5; --warn: #8a5200; --warn-soft: #fff0d2;
    --shadow: 0 10px 34px rgba(15, 27, 36, .16), 0 2px 6px rgba(15, 27, 36, .08);
    --glass: rgba(255, 255, 255, .86);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, .item:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #app { display: grid; grid-template-columns: 372px 1fr; height: 100%; }
  aside { background: var(--panel); display: flex; flex-direction: column; min-height: 0; z-index: 12; box-shadow: 1px 0 0 var(--line), 8px 0 30px rgba(15, 27, 36, .06); }
  header { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .logo { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(145deg, #12a0b1, var(--accent-ink)); display: grid; place-items: center; flex: none; box-shadow: 0 4px 12px rgba(11, 122, 136, .35); }
  .logo svg { width: 20px; height: 20px; }
  .brand h1 { font-size: 16.5px; margin: 0; letter-spacing: -.01em; }
  .brand p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; }
  .tab { border: 0; background: transparent; padding: 9px 4px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background .15s, color .15s; }
  .tab svg { width: 15px; height: 15px; flex: none; }
  .tab.on { background: #fff; color: var(--accent-ink); box-shadow: 0 1px 4px rgba(15, 27, 36, .14); }
  #panel { overflow-y: auto; flex: 1; padding: 14px 12px 20px; scrollbar-width: thin; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 2px 6px 10px; line-height: 1.5; }
  .search { position: relative; margin-bottom: 8px; }
  .search input { width: 100%; padding: 12px 12px 12px 38px; border: 1.5px solid var(--line); border-radius: 12px; font: inherit; font-size: 15px; background: var(--soft); color: var(--ink); }
  .search input:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  label.from { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 4px 10px; }
  label.from select { width: 100%; margin-top: 5px; padding: 10px; border: 1.5px solid var(--line); border-radius: 10px; font: inherit; font-size: 14px; background: #fff; color: var(--ink); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 2px 12px; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .floors { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
  .fbtn { display: flex; justify-content: space-between; align-items: center; border: 1.5px solid var(--line); background: #fff; border-radius: 11px; padding: 10px 13px; cursor: pointer; font-size: 13.5px; text-align: left; color: var(--ink); }
  .fbtn small { color: var(--muted); font-size: 12px; }
  .fbtn.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 650; box-shadow: inset 4px 0 0 var(--accent); }
  .group { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 16px 6px 6px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 11px; border-radius: 12px; cursor: pointer; transition: background .12s; }
  .item:hover { background: var(--soft); }
  .item.sel { background: var(--accent-soft); }
  .item b { font-weight: 600; font-size: 14px; }
  .item .d { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .floor { font-size: 11.5px; font-weight: 650; color: var(--accent-ink); background: var(--accent-soft); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .pend, .acc { font-size: 10.5px; font-weight: 650; padding: 2px 7px; border-radius: 999px; margin-left: 6px; white-space: nowrap; vertical-align: 1px; }
  .pend { color: var(--warn); background: var(--warn-soft); }
  .acc.vis { color: #4b3a8f; background: #ece8fa; }
  .acc.no { color: #a3261f; background: #fbe4e2; }
  #aviso { display: none; font-size: 12.5px; line-height: 1.4; padding: 9px 11px; border-radius: 10px; margin: 0 0 10px; background: var(--warn-soft); color: var(--warn); }
  #aviso.no { background: #fbe4e2; color: #a3261f; font-weight: 600; font-size: 13.5px; }
  #toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 12.5px; padding: 9px 15px; border-radius: 999px; display: none; max-width: calc(100% - 32px); text-align: center; z-index: 20; box-shadow: var(--shadow); }
  main { position: relative; min-width: 0; background: #cfdbe3; }
  #scene { position: absolute; inset: 0; }
  #loader { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: linear-gradient(#cfe0ea, #e9eef2); transition: opacity .5s; }
  #loader div { display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  #loader i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(11, 122, 136, .2); border-top-color: var(--accent); animation: giro .8s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }
  .label { font-size: 12px; font-weight: 650; color: var(--ink); background: rgba(255, 255, 255, .95); padding: 5px 10px; border-radius: 999px; box-shadow: 0 2px 8px rgba(15, 27, 36, .22); pointer-events: auto; cursor: pointer; white-space: nowrap; user-select: none; }
  .label.bld { display: flex; align-items: center; gap: 7px; padding: 6px 12px 6px 9px; font-size: 12.5px; }
  .label.bld::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--accent)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--accent)) 22%, transparent); }
  .label.gate { background: var(--ink); color: #fff; }
  .label.park { background: #33414c; color: #fff; pointer-events: none; font-weight: 600; }
  .label.gray { background: rgba(255, 255, 255, .7); color: var(--muted); font-weight: 500; box-shadow: none; pointer-events: none; }
  .label.area { font-size: 11.5px; padding: 4px 9px 4px 8px; border-left: 4px solid; border-radius: 7px; }
  .label.area.sel { background: var(--ink); color: #fff; }
  #card { z-index: 10; position: absolute; left: 16px; bottom: 16px; width: min(384px, calc(100% - 32px)); background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border: 1px solid rgba(255, 255, 255, .7); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; display: none; }
  #card.show { display: block; animation: sube .22s ease-out; }
  @keyframes sube { from { transform: translateY(10px); opacity: 0; } }
  #card h2 { margin: 0 0 4px; font-size: 17px; letter-spacing: -.01em; }
  #card .meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; line-height: 1.6; }
  #card p { font-size: 13.5px; margin: 0 0 12px; line-height: 1.45; }
  .row { display: flex; gap: 8px; }
  .btn { flex: 1; border: 0; border-radius: 12px; padding: 11px; font-size: 14px; font-weight: 650; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(11, 122, 136, .3); }
  .btn.ghost { background: rgba(15, 27, 36, .07); color: var(--ink); }
  #pasosBox { display: none; margin-top: 10px; font-size: 13px; }
  #pasosBox summary { cursor: pointer; font-weight: 650; color: var(--accent-ink); padding: 4px 0; }
  #steps { margin: 6px 0 0; padding-left: 20px; font-size: 13px; }
  #steps li { margin: 5px 0; line-height: 1.4; }
  #steps li.ref { color: var(--ink); font-weight: 600; }
  .tools { z-index: 10; position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 2px; padding: 4px; border-radius: 15px; background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border: 1px solid rgba(255, 255, 255, .7); box-shadow: var(--shadow); }
  .tool { width: 42px; height: 40px; border-radius: 11px; border: 0; background: transparent; cursor: pointer; font-weight: 700; font-size: 11.5px; letter-spacing: .02em; color: var(--ink); display: grid; place-items: center; }
  .tool:hover { background: rgba(15, 27, 36, .07); }
  .tool.on { background: var(--accent); color: #fff; }
  .tool svg { width: 20px; height: 20px; }
  .tools hr { border: 0; height: 1px; background: rgba(15, 27, 36, .1); margin: 2px 6px; }
  #bN svg { transition: transform .05s linear; }
  #banner { z-index: 10; position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: rgba(15, 27, 36, .88); backdrop-filter: blur(8px); color: #fff; font-size: 13px; font-weight: 650; padding: 8px 16px; border-radius: 999px; display: none; white-space: nowrap; box-shadow: var(--shadow); }
  .note { z-index: 9; position: absolute; right: 14px; bottom: 12px; font-size: 10.5px; color: #3d4a54; background: rgba(255, 255, 255, .72); backdrop-filter: blur(6px); padding: 5px 9px; border-radius: 8px; max-width: 300px; line-height: 1.4; }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 56% 44%; }
    aside { order: 2; border-radius: 20px 20px 0 0; margin-top: -16px; box-shadow: 0 -8px 30px rgba(15, 27, 36, .18); position: relative; }
    aside::before { content: ""; position: absolute; top: 7px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 4px; background: #cfd8de; }
    main { order: 1; }
    header { padding: 20px 12px 10px; }
    .brand { display: none; }
    #panel { padding: 10px 10px 18px; }
    #card { bottom: 26px; left: 10px; width: calc(100% - 20px); padding: 13px; border-radius: 16px; }
    #card h2 { font-size: 16px; }
    #card p { margin-bottom: 8px; }
    #aviso { font-size: 12px; padding: 7px 9px; margin-bottom: 8px; }
    #aviso.no { font-size: 13px; }
    .btn { padding: 10px; }
    .note { display: none; }
    #toast { bottom: 28px; }
    .tools { right: 10px; top: 10px; }
    .tool { width: 40px; height: 38px; }
    #banner { top: 10px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { #card.show { animation: none; } #loader i { animation-duration: 2s; } }
</style>
<script src="datos.js"></script>
<script src="salas.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./lib/three/build/three.module.js",
  "three/addons/": "./lib/three/examples/jsm/"
} }
</script>

<body>
<div id="app">
  <aside>
    <header>
      <div class="brand">
        <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        <div><h1>Mapa del Hospital Escuela</h1><p>Encuentra un área y cómo llegar</p></div>
      </div>
      <div class="tabs">
        <button class="tab" data-v="exterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-5h6v5"/></svg>Exterior</button>
        <button class="tab" data-v="niveles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5"/></svg>Niveles</button>
        <button class="tab" data-v="recorrido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg>Cómo llegar</button>
      </div>
    </header>
    <div id="panel"></div>
  </aside>
  <main>
    <div id="scene"></div>
    <div id="banner"></div>
    <div id="loader"><div><i></i>Cargando el mapa…</div></div>
    <div class="tools">
      <button class="tool" id="bN" title="Brújula: toca para poner el norte arriba" aria-label="Norte arriba"><svg viewBox="0 0 24 24"><path d="M12 3 16 13H8z" fill="#e8453c"/><path d="M8 13h8l-4 8z" fill="#9aa6af"/></svg></button>
      <hr>
      <button class="tool" id="b3d" title="Vista 3D">3D</button>
      <button class="tool" id="b2d" title="Vista desde arriba">2D</button>
      <button class="tool" id="bReset" title="Ver todo el hospital" aria-label="Ver todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <hr>
      <button class="tool" id="bSat" title="Foto satelital (necesita internet)">SAT</button>
      <button class="tool" id="bHQ" title="Calidad alta: sombras de contacto y bordes suaves. Desactívala si va lento.">HD</button>
    </div>
    <div id="card">
      <h2 id="cTitle"></h2>
      <div class="meta" id="cMeta"></div>
      <p id="cDesc"></p>
      <div id="aviso"></div>
      <div class="row">
        <button class="btn primary" id="bRoute">Cómo llegar</button>
        <button class="btn ghost" id="bClose">Cerrar</button>
      </div>
      <details id="pasosBox"><summary>Cómo llegar, paso a paso</summary><ol id="steps"></ol></details>
    </div>
    <div id="toast" role="status"></div>
    <div class="note">Formas: © colaboradores de OpenStreetMap · Imagen satelital: Esri, Maxar, Earthstar Geographics. La distribución interior es una hipótesis de trabajo, no el plano real.</div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const D = window.DATOS;
const FH = 4;                 // altura de cada nivel (m)
const CELL = 1.5;             // tamaño de la cuadrícula interior (m)
const PALETTE = ['#e8453c', '#2f8fd8', '#3aa76d', '#f2a03d', '#7a5fd9', '#d95fa6', '#14a3a3', '#a1785c'];
const byId = Object.fromEntries(D.edificios.map(b => [b.id, b]));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const pendTag = c => c === false ? '<span class="pend">Por confirmar</span>' : '';
// Salas del levantamiento (salas.js, generado desde el CSV): reemplazan las hipótesis de los niveles que ya se levantaron.
if (Array.isArray(window.SALAS) && window.SALAS.length) {
  const hechos = new Set(window.SALAS.map(s => s.edificio + ':' + s.nivel));
  D.areas = D.areas.filter(a => !hechos.has(a.edificio + ':' + a.nivel)).concat(window.SALAS);
}
D.areas.forEach((a, i) => a.i = i);

// ======== CALIDAD SEGÚN EL EQUIPO ========
// Celulares y equipos modestos arrancan en calidad ligera. ?calidad=alta o ?calidad=baja fuerzan una u otra.
const qp = new URLSearchParams(location.search).get('calidad');
const LOW = qp ? qp === 'baja' : (matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 700 || (navigator.deviceMemory && navigator.deviceMemory <= 2));
const FORCE = !!qp;                      // si el usuario fuerza la calidad, no se baja sola
let dirty = true;                        // se dibuja solo cuando algo cambia
const invalidate = () => { dirty = true; };
const declutter = [];                    // etiquetas que solo se muestran al acercarse
const ACCESO = {
  publico:     { txt: 'Público', ruta: true },
  visitas:     { txt: 'Visitas', ruta: true, clase: 'vis', aviso: 'Ingreso de visitas según horario y normas de la sala.' },
  estudiantes: { txt: 'Estudiantes', ruta: true, clase: 'vis' },
  personal:    { txt: 'Solo personal', ruta: false, clase: 'no', aviso: 'Uso exclusivo del personal del hospital. Si necesita algo de esta área, pregunte en Información.' },
  restringido: { txt: 'Acceso restringido', ruta: false, clase: 'no', aviso: 'Acceso restringido. Pregunte en Información por la sala de espera o el trámite que necesita.' },
};
const accesoOf = a => { const k = norm(String(a.acceso || 'publico')).replace(/[^a-z]/g, ''); return ACCESO[k] || ACCESO[k.replace(/a$/, 'o')] || ACCESO.publico; };
const accTag = a => { const c = accesoOf(a); return c.clase ? `<span class="acc ${c.clase}">${esc(c.txt)}</span>` : ''; };

// ======== ESCENA ========
const host = document.getElementById('scene');
const scene = new THREE.Scene();
const HAZE = '#d9e3ea';
scene.fog = new THREE.Fog(HAZE, 650, 1700);
const camera = new THREE.PerspectiveCamera(45, 1, 1, 4000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = LOW ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;     // la escena es estática: las sombras se recalculan solo cuando algo cambia
renderer.shadowMap.needsUpdate = true;
host.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
Object.assign(labelRenderer.domElement.style, { position: 'absolute', inset: '0', pointerEvents: 'none', zIndex: '1' });
host.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.15;
controls.addEventListener('change', invalidate);
controls.minDistance = 20;
controls.maxDistance = 560;

// ---- cielo (degradado) y reflejos del cielo en vidrios ----
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#4f86c9') }, horizon: { value: new THREE.Color(HAZE) }, below: { value: new THREE.Color('#8d8f86') } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform vec3 top; uniform vec3 horizon; uniform vec3 below; varying vec3 vP;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
    float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; } return v; }
    void main(){ float h = vP.y; vec3 c = h > 0.0 ? mix(horizon, top, pow(h, 0.55)) : mix(horizon, below, min(-h * 4.0, 1.0));
    if (h > 0.02) {                                   // nubes suaves
      vec2 uv = vP.xz / (h + 0.25) * 1.6;
      float cl = smoothstep(0.52, 0.78, fbm(uv + vec2(3.0, 1.0)));
      c = mix(c, vec3(0.97, 0.97, 0.98), cl * 0.85 * smoothstep(0.02, 0.2, h));
    }
    gl_FragColor = vec4(c, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16), skyMat);
scene.add(sky);
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene(); envScene.add(new THREE.Mesh(sky.geometry, skyMat));
  scene.environment = pmrem.fromScene(envScene, 0.01).texture;
}

scene.add(new THREE.HemisphereLight('#e4eeff', '#948c74', 0.85));
const sun = new THREE.DirectionalLight('#fff0db', 2.7);
sun.position.set(-170, 190, 120);
sun.castShadow = true;
sun.shadow.mapSize.set(LOW ? 2048 : 4096, LOW ? 2048 : 4096);
sun.shadow.bias = -0.0004;

  areas.forEach((a, k) => {

}

  const curve = list => { const c = new THREE.CurvePath(); for (let i = 0; i < list.length - 1; i++) c.add(new THREE.LineCurve3(lift(list[i]), lift(list[i + 1]))); return c; };

  if (composer) return;
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const gtao = new GTAOPass(scene, camera, 2, 2);
  gtao.updateGtaoMaterial({ radius: 5, distanceExponent: 1.4, thickness: 3, scale: 1.3, samples: 16 });
  gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 5, rings: 2, samples: 16 });
  gtao.blendIntensity = 0.8;
  composer.addPass(gtao);
  composer.addPass(new SMAAPass(2, 2));
  composer.addPass(new OutputPass());
  composer.addPass(new ShaderPass({ uniforms: { tDiffuse: { value: null } },   // acabado: un poco más de contraste y color, y viñeta suave
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c = texture2D(tDiffuse, vUv); float l = dot(c.rgb, vec3(.299,.587,.114)); c.rgb = mix(vec3(l), c.rgb, 1.14); c.rgb = (c.rgb - .5) * 1.07 + .5; vec2 d = vUv - .5; c.rgb *= 1. - dot(d, d) * .5; gl_FragColor = c; }' }));
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(host.clientWidth, host.clientHeight);
}
let hq = !LOW;
const bHQ = document.getElementById('bHQ'), bN = document.getElementById('bN'), needle = bN.firstElementChild;
bN.onclick = () => flyTo(controls.target.clone(), camera.position.distanceTo(controls.target), Math.max(0.05, controls.getPolarAngle()), 0);
let ready = false;
function setHQ(v) {
  hq = v; if (v) ensureComposer();
  bHQ.classList.toggle('on', v);
  renderer.shadowMap.type = v ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap; renderer.shadowMap.needsUpdate = true; invalidate();
}
bHQ.onclick = () => { degraded = true; setHQ(!hq); };
document.getElementById('bSat').onclick = () => setSat(!satOn);      // si el usuario decide, no se cambia sola
setHQ(hq);
function toast(txt) {
  const el = document.getElementById('toast'); el.textContent = txt; el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}
// Si el equipo va lento, bajar la calidad (una sola vez): sin posprocesado, menos resolución, sombras más ligeras.
let degraded = FORCE, streak = 0, lento = 0, muyLento = 0, lastDraw = 0, calentamiento = 30;
function adapt(t) {
  const gap = t - lastDraw; lastDraw = t;
  if (degraded) return;
  if (calentamiento > 0) { calentamiento--; return; }           // los primeros cuadros compilan shaders: no cuentan
  if (gap > 2) { streak = lento = muyLento = 0; return; }       // pestaña oculta o pausa larga: no cuenta
  streak++; if (gap > 0.06) lento++; if (gap > 0.2) muyLento++;
  // casi todo muy lento (≤5 cuadros/s): se baja pronto; la mayoría lento (<16 cuadros/s): tras ~3 s de uso continuo.
  // Se cuenta la fracción de cuadros lentos (no el promedio) para que un tirón aislado no cambie la calidad.
  if ((streak >= 12 && muyLento / streak > 0.8) || (streak >= 90 && lento / streak > 0.6)) {
    degraded = true; setHQ(false);
    if (renderer.getPixelRatio() > 1.25) { renderer.setPixelRatio(1.25); resize(); }
    sun.shadow.mapSize.set(2048, 2048); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
    renderer.shadowMap.needsUpdate = true;
    toast('Se bajó la calidad para que el mapa vaya fluido. El botón HD la vuelve a subir.');
    return;
  }
  if (streak >= 90) streak = lento = muyLento = 0;
}
function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
  camera.aspect = w / h; camera.updateProjectionMatrix(); invalidate();
}
new ResizeObserver(resize).observe(host);
// etiquetas de estacionamientos y vecinos: solo al acercarse, para no tapar el mapa
function updateLabels() {
  const d = camera.position.distanceTo(controls.target), ext = state.view === 'exterior';
  declutter.forEach(({ o, max }) => setVisible(o, ext && d < max));
}
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (satDirty.size && t - satUp > 0.3) { satDirty.forEach(x => { x.needsUpdate = true; }); satDirty.clear(); satUp = t; dirty = true; }
  if (camGoal) {
    const k = 1 - Math.pow(0.02, dt);
    camera.position.lerp(camGoal.pos, k); controls.target.lerp(camGoal.target, k);
    if (camera.position.distanceTo(camGoal.pos) < 0.3) camGoal = null;
    dirty = true;
  }
  const anim = pin.visible || (routeCurve && walker && walker.visible);
  if (pin.visible) { pinHead.position.y = 5 + Math.sin(t * 3) * 0.7; pin.rotation.y += dt; }
  if (routeCurve && walker) { routeT = (routeT + dt * 0.2) % 1; walker.position.copy(routeCurve.getPointAt(routeT)).y += 1.4; }
  controls.update();                                            // con inercia, avisa con 'change' mientras se mueve
  if (!dirty && !(anim && t - lastDraw >= 1 / 30 - 0.004)) {             // nada que dibujar: no se gasta batería
    if (!anim) streak = lento = muyLento = 0;                   // en reposo no se mide la fluidez
    return;
  }
  dirty = false; adapt(t); updateLabels();
  if (hq && composer) composer.render(); else renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  needle.style.transform = `rotate(${controls.getAzimuthalAngle()}rad)`;
  if (!ready) { ready = true; const l = document.getElementById('loader'); l.style.opacity = 0; setTimeout(() => l.remove(), 550); }
}
camera.position.set(220, 280, 330);
b3d.classList.add('on');
setView('exterior'); resize(); tick();
</script>
