<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa 3D Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f5; --panel: #ffffff; --ink: #14212b; --muted: #5b6b78;
    --line: #dbe3ea; --accent: #0a7c8c; --accent-soft: #e0f2f4; --warn: #9a5b00; --warn-soft: #fff1d6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--bg); overflow: hidden; }
  button { font-family: inherit; }
  #app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; z-index: 2; }
  header { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 0 10px; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: #eef2f5; border-radius: 10px; padding: 3px; gap: 3px; }
  .tab { border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .tab.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #panel { overflow-y: auto; flex: 1; padding: 12px 12px 18px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 2px 6px 10px; line-height: 1.45; }
  .search { position: relative; margin-bottom: 8px; }
  .search input { width: 100%; padding: 10px 12px 10px 34px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 14px; background: #f7f9fb; }
  .search input:focus { outline: 2px solid var(--accent); border-color: transparent; background: #fff; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  label.from { display: block; font-size: 12px; color: var(--muted); margin: 0 4px 10px; }
  label.from select { width: 100%; margin-top: 4px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13.5px; background: #fff; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 2px 10px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 11px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .floors { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .fbtn { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 9px 12px; cursor: pointer; font-size: 13.5px; text-align: left; color: var(--ink); }
  .fbtn small { color: var(--muted); font-size: 12px; }
  .fbtn.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .group { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 6px 6px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
  .item:hover { background: #f3f6f8; }
  .item.sel { background: var(--accent-soft); }
  .item b { font-weight: 600; font-size: 14px; }
  .item .d { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .floor { font-size: 11.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .pend { font-size: 10.5px; font-weight: 600; color: var(--warn); background: var(--warn-soft); padding: 2px 6px; border-radius: 5px; margin-left: 6px; white-space: nowrap; vertical-align: 1px; }
  .acc { font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 5px; margin-left: 6px; white-space: nowrap; vertical-align: 1px; }
  .acc.vis { color: #4b3a8f; background: #ece8fa; }
  .acc.no { color: #a3261f; background: #fbe4e2; }
  #aviso { display: none; font-size: 12.5px; line-height: 1.4; padding: 9px 11px; border-radius: 9px; margin: 0 0 10px; background: var(--warn-soft); color: var(--warn); }
  #aviso.no { background: #fbe4e2; color: #a3261f; font-weight: 600; font-size: 13.5px; }
  #toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 12.5px; padding: 8px 14px; border-radius: 999px; display: none; max-width: calc(100% - 32px); text-align: center; z-index: 20; }
  #steps li.ref { color: var(--ink); font-weight: 600; }
  main { position: relative; min-width: 0; }
  #scene { position: absolute; inset: 0; }
  .label { font-size: 12px; font-weight: 600; color: var(--ink); background: rgba(255,255,255,.92); padding: 4px 8px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.15); pointer-events: auto; cursor: pointer; white-space: nowrap; }
  .label.gate { background: var(--ink); color: #fff; }
  .label.park { background: #4b5a66; color: #fff; pointer-events: none; }
  .label.gray { background: rgba(255,255,255,.6); color: var(--muted); font-weight: 500; box-shadow: none; pointer-events: none; }
  .label.area { font-size: 11px; font-weight: 600; padding: 3px 7px; border-left: 4px solid; }
  .label.area.sel { background: var(--ink); color: #fff; }
  #card { z-index: 10; position: absolute; left: 16px; bottom: 16px; width: min(370px, calc(100% - 32px)); background: var(--panel); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.18); padding: 16px; display: none; }
  #card.show { display: block; }
  #card h2 { margin: 0 0 4px; font-size: 17px; }
  #card .meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  #card p { font-size: 13.5px; margin: 0 0 12px; line-height: 1.45; }
  .row { display: flex; gap: 8px; }
  .btn { flex: 1; border: 0; border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: #eef2f5; color: var(--ink); }
  #pasosBox { display: none; margin-top: 10px; font-size: 13px; }
  #pasosBox summary { cursor: pointer; font-weight: 600; color: var(--accent); padding: 4px 0; }
  #steps { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  #steps li { margin: 4px 0; }
  .tools { z-index: 10; position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .tool { width: 42px; height: 42px; border-radius: 10px; border: 0; background: var(--panel); box-shadow: 0 2px 8px rgba(0,0,0,.15); cursor: pointer; font-weight: 700; font-size: 12px; color: var(--ink); }
  .tool.on { background: var(--accent); color: #fff; }
  #banner { z-index: 10; position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; display: none; white-space: nowrap; }
  .note { z-index: 10; position: absolute; right: 16px; bottom: 16px; font-size: 11px; color: var(--muted); background: rgba(255,255,255,.88); padding: 6px 10px; border-radius: 8px; max-width: 290px; line-height: 1.4; }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
    aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
    main { order: 1; }
    header { padding: 10px 12px; }
    header h1 { display: none; }
    #card { bottom: 10px; left: 10px; width: calc(100% - 20px); padding: 12px; }
    #card h2 { font-size: 16px; }
    #card p { margin-bottom: 8px; }
    #aviso { font-size: 12px; padding: 7px 9px; margin-bottom: 8px; }
    #aviso.no { font-size: 13px; }
    .btn { padding: 9px; }
    .note { display: none; }
    #banner { top: 10px; font-size: 12px; }
  }
</style>
<script src="datos.js"></script>
<script src="salas.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./lib/three/build/three.module.js",
  "three/addons/": "./lib/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1>Mapa del Hospital Escuela</h1>
      <div class="tabs">
        <button class="tab" data-v="exterior">Exterior</button>
        <button class="tab" data-v="niveles">Por niveles</button>
        <button class="tab" data-v="recorrido">Recorrido</button>
      </div>
    </header>
    <div id="panel"></div>
  </aside>
  <main>
    <div id="scene"></div>
    <div id="banner"></div>
    <div class="tools">
      <button class="tool" id="b3d" title="Vista 3D">3D</button>
      <button class="tool" id="b2d" title="Vista desde arriba">2D</button>
      <button class="tool" id="bReset" title="Ver todo">⤢</button>
      <button class="tool" id="bHQ" title="Calidad alta: sombras de contacto y bordes suaves. Desactívala si va lento.">HD</button>
    </div>
    <div id="card">
      <h2 id="cTitle"></h2>
      <div class="meta" id="cMeta"></div>
      <p id="cDesc"></p>
      <div id="aviso"></div>
      <div class="row">
        <button class="btn primary" id="bRoute">Cómo llegar</button>
        <button class="btn ghost" id="bClose">Cerrar</button>
      </div>
      <details id="pasosBox"><summary>Cómo llegar, paso a paso</summary><ol id="steps"></ol></details>
    </div>
    <div id="toast" role="status"></div>
    <div class="note">Formas: © colaboradores de OpenStreetMap · Imagen satelital: Esri, Maxar, Earthstar Geographics. La distribución interior es una hipótesis de trabajo, no el plano real.</div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const D = window.DATOS;
const FH = 4;                 // altura de cada nivel (m)
const CELL = 1.5;             // tamaño de la cuadrícula interior (m)
const PALETTE = ['#e8453c', '#2f8fd8', '#3aa76d', '#f2a03d', '#7a5fd9', '#d95fa6', '#14a3a3', '#a1785c'];
const byId = Object.fromEntries(D.edificios.map(b => [b.id, b]));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const pendTag = c => c === false ? '<span class="pend">Por confirmar</span>' : '';
// Salas del levantamiento (salas.js, generado desde el CSV): reemplazan las hipótesis de los niveles que ya se levantaron.
if (Array.isArray(window.SALAS) && window.SALAS.length) {
  const hechos = new Set(window.SALAS.map(s => s.edificio + ':' + s.nivel));
  D.areas = D.areas.filter(a => !hechos.has(a.edificio + ':' + a.nivel)).concat(window.SALAS);
}
D.areas.forEach((a, i) => a.i = i);

// ======== CALIDAD SEGÚN EL EQUIPO ========
// Celulares y equipos modestos arrancan en calidad ligera. ?calidad=alta o ?calidad=baja fuerzan una u otra.
const qp = new URLSearchParams(location.search).get('calidad');
const LOW = qp ? qp === 'baja' : (matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 700 || (navigator.deviceMemory && navigator.deviceMemory <= 2));
const FORCE = !!qp;                      // si el usuario fuerza la calidad, no se baja sola
let dirty = true;                        // se dibuja solo cuando algo cambia
const invalidate = () => { dirty = true; };
const declutter = [];                    // etiquetas que solo se muestran al acercarse
const ACCESO = {
  publico:     { txt: 'Público', ruta: true },
  visitas:     { txt: 'Visitas', ruta: true, clase: 'vis', aviso: 'Ingreso de visitas según horario y normas de la sala.' },
  estudiantes: { txt: 'Estudiantes', ruta: true, clase: 'vis' },
  personal:    { txt: 'Solo personal', ruta: false, clase: 'no', aviso: 'Uso exclusivo del personal del hospital. Si necesita algo de esta área, pregunte en Información.' },
  restringido: { txt: 'Acceso restringido', ruta: false, clase: 'no', aviso: 'Acceso restringido. Pregunte en Información por la sala de espera o el trámite que necesita.' },
};
const accesoOf = a => { const k = norm(String(a.acceso || 'publico')).replace(/[^a-z]/g, ''); return ACCESO[k] || ACCESO[k.replace(/a$/, 'o')] || ACCESO.publico; };
const accTag = a => { const c = accesoOf(a); return c.clase ? `<span class="acc ${c.clase}">${esc(c.txt)}</span>` : ''; };

// ======== ESCENA ========
const host = document.getElementById('scene');
const scene = new THREE.Scene();
const HAZE = '#d9e3ea';
scene.fog = new THREE.Fog(HAZE, 650, 1700);
const camera = new THREE.PerspectiveCamera(45, 1, 1, 4000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = LOW ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;     // la escena es estática: las sombras se recalculan solo cuando algo cambia
renderer.shadowMap.needsUpdate = true;
host.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
Object.assign(labelRenderer.domElement.style, { position: 'absolute', inset: '0', pointerEvents: 'none', zIndex: '1' });
host.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.15;
controls.addEventListener('change', invalidate);
controls.minDistance = 20;
controls.maxDistance = 560;

// ---- cielo (degradado) y reflejos del cielo en vidrios ----
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#4f86c9') }, horizon: { value: new THREE.Color(HAZE) }, below: { value: new THREE.Color('#8d8f86') } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform vec3 top; uniform vec3 horizon; uniform vec3 below; varying vec3 vP;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
    float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; } return v; }
    void main(){ float h = vP.y; vec3 c = h > 0.0 ? mix(horizon, top, pow(h, 0.55)) : mix(horizon, below, min(-h * 4.0, 1.0));
    if (h > 0.02) {                                   // nubes suaves
      vec2 uv = vP.xz / (h + 0.25) * 1.6;
      float cl = smoothstep(0.52, 0.78, fbm(uv + vec2(3.0, 1.0)));
      c = mix(c, vec3(0.97, 0.97, 0.98), cl * 0.85 * smoothstep(0.02, 0.2, h));
    }
    gl_FragColor = vec4(c, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16), skyMat);
scene.add(sky);
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene(); envScene.add(new THREE.Mesh(sky.geometry, skyMat));
  scene.environment = pmrem.fromScene(envScene, 0.01).texture;
}

scene.add(new THREE.HemisphereLight('#dfeaff', '#80785f', 0.45));
const sun = new THREE.DirectionalLight('#ffeed6', 2.4);
sun.position.set(-170, 190, 120);
sun.castShadow = true;
sun.shadow.mapSize.set(LOW ? 2048 : 4096, LOW ? 2048 : 4096);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.6;
Object.assign(sun.shadow.camera, { left: -220, right: 220, top: 220, bottom: -220, far: 800 });
scene.add(sun);

// ======== TEXTURAS GENERADAS (sin archivos de imagen) ========
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function grain(ctx, w, h, n, alpha) {
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = rnd() < 0.5 ? `rgba(0,0,0,${alpha * rnd()})` : `rgba(255,255,255,${alpha * rnd()})`;
    ctx.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2);
  }
}
function tex(c, repeatX, repeatY, srgb = true) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), LOW ? 4 : 16);
  return t;
}
const BAY = 3.2;          // ancho de un módulo de ventana (m)
const BAYS = 4;           // módulos por textura: cada ventana es distinta y no se nota la repetición
// Fachada de un piso. estilo: 'cinta' (ventanas entre columnas), 'ventanas' (sueltas), 'vidrio' (muro cortina), 'vecino'
function facade(wall, estilo, acceso = false) {
  const PX = 160, W = PX * BAYS, H = Math.round(PX * FH / BAY);
  const [c, x] = canvas(W, H), [r, rx] = canvas(W, H), [bp, bx] = canvas(W, H);
  x.fillStyle = wall; x.fillRect(0, 0, W, H); grain(x, W, H, 9000, 0.06);
  for (let i = 0; i < 18; i++) {                                          // chorreaduras de lluvia
    const sx = rnd() * W, g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(70,60,50,0.09)'); g.addColorStop(1, 'rgba(70,60,50,0)');
    x.fillStyle = g; x.fillRect(sx, 0, 4 + rnd() * 14, H * (0.4 + rnd() * 0.6));
  }
  rx.fillStyle = '#d9d9d9'; rx.fillRect(0, 0, W, H);
  bx.fillStyle = '#808080'; bx.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(0,0,0,0.10)'; x.fillRect(0, 0, W, 16);              // canto de losa
  bx.fillStyle = '#a8a8a8'; bx.fillRect(0, 0, W, 16);
  x.fillStyle = 'rgba(0,0,0,0.25)'; x.fillRect(0, 16, W, 2);
  const glass = (y0, h) => { const g = x.createLinearGradient(0, y0, 0, y0 + h); g.addColorStop(0, '#a9c0d2'); g.addColorStop(0.5, '#5b778c'); g.addColorStop(1, '#2a3a46'); return g; };
  const win = (wx, wy, ww, wh) => {
    bx.fillStyle = '#2a2a2a'; bx.fillRect(wx - 4, wy - 4, ww + 8, wh + 8);   // vano rehundido
    x.fillStyle = '#2f3438'; x.fillRect(wx - 4, wy - 4, ww + 8, wh + 8);
    x.fillStyle = glass(wy, wh); x.fillRect(wx, wy, ww, wh);
    rx.fillStyle = '#1a1a1a'; rx.fillRect(wx, wy, ww, wh);
    const v = rnd();
    if (v < 0.35) {                                                         // persiana
      const ph = wh * (0.2 + rnd() * 0.6);
      x.fillStyle = 'rgba(232,228,214,0.85)'; x.fillRect(wx, wy, ww, ph);
      x.fillStyle = 'rgba(0,0,0,0.08)'; for (let yy = wy; yy < wy + ph; yy += 5) x.fillRect(wx, yy, ww, 1);
      rx.fillStyle = '#bdbdbd'; rx.fillRect(wx, wy, ww, ph);
    } else if (v < 0.55) {                                                  // cortinas
      x.fillStyle = ['rgba(170,195,210,0.75)', 'rgba(214,200,170,0.75)', 'rgba(190,210,190,0.7)'][Math.floor(rnd() * 3)];
      const cw = ww * (0.2 + rnd() * 0.3); x.fillRect(wx, wy, cw, wh); x.fillRect(wx + ww - cw, wy, cw, wh);
      rx.fillStyle = '#bdbdbd'; rx.fillRect(wx, wy, cw, wh); rx.fillRect(wx + ww - cw, wy, cw, wh);
    }
    x.fillStyle = 'rgba(255,255,255,0.08)';                                 // reflejo
    x.beginPath(); x.moveTo(wx + ww * 0.1, wy); x.lineTo(wx + ww * 0.35, wy); x.lineTo(wx + ww * 0.05, wy + wh); x.lineTo(wx, wy + wh); x.closePath(); x.fill();
    x.fillStyle = '#3a4045'; x.fillRect(wx + ww / 2 - 2, wy, 4, wh); x.fillRect(wx, wy + wh * 0.3, ww, 3);   // carpintería
    if (!acceso) {
      x.fillStyle = 'rgba(255,255,255,0.5)'; x.fillRect(wx - 6, wy + wh + 4, ww + 12, 4);                  // alféizar

  // Se cuenta la fracción de cuadros lentos (no el promedio) para que un tirón aislado no cambie la calidad.
  if ((streak >= 12 && muyLento / streak > 0.8) || (streak >= 90 && lento / streak > 0.6)) {

    renderer.shadowMap.needsUpdate = true;
